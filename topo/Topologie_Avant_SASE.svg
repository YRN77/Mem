<text x="503.5" y="103.0" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#444444">Web/SaaS → Internet (direct, non filtré)</text>
<line x1="280" y1="130" x2="700" y2="130" stroke="#2196f3" stroke-width="2" stroke-linecap="round"/>
<polygon points="707.6727206985355,125.29581493962407 707.6727206985355,134.70418506037592 694.0,130.0" fill="#2196f3"/>
<text x="496.0" y="123.0" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#444444">Backhaul via VPN → proxy du siège</text>
<rect x="420" y="355" width="60" height="20" rx="0" fill="#c62828" stroke="#b71c1c" stroke-width="2"/>
<text x="422" y="370.0" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">branch-pc 192.168.10.10</text>
<rect x="762" y="142" width="318" height="240" rx="0" fill="#fafafa" stroke="#e0e0e0" stroke-width="1"/>
<text x="770" y="145" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#222222">Limites de l'architecture de référence (L1-L9) :</text>
<text x="770" y="155" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L1 – Confiance implicite : tunnel VPN → accès réseau étendu après 1 authentification</text>
<text x="770" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L2 – Backhaul web/SaaS vers le siège (ou Internet direct, non filtré)</text>
<text x="770" y="197" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L3 – Politiques par adresse IP : sans notion d'utilisateur/groupe</text>
<text x="770" y="218" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L4 – Journaux fragmentés (Firewall / VPN / proxy séparés)</text>
<text x="770" y="239" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L5 – Lien unique succursale : pas de SD-WAN, pas de bascule multi-chemins</text>
<text x="770" y="260" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L6 – Aucun contrôle des actions/contenus d'applications SaaS (pas de CASB/DLP)</text>
<text x="770" y="281" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L7 – Lateral movement : réseau interne accessible par IP après VPN</text>
<text x="770" y="302" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L8 – Filtrage web faible côté distants : pas de SWG centralisé</text>
<text x="770" y="323" font-family="Segoe UI, Arial, sans-serif" font-size="10" fill="#222222">L9 – Exposition maximale : tunnel unique, sans ségmentation applicative</text>
</svg>
