<text x="506.0" y="255.5" font-family="Segoe UI, Arial, sans-serif" font-size="9" fill="#444444">Sortie VPN → câblage sans segmentation</text>
<line x1="295" y1="110" x2="700" y2="110" stroke="#2196f3" stroke-width="2" stroke-linecap="round"/>
